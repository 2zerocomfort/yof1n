<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>yof1n — Links</title>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --text: #eef1f6;
    --muted: #9aa3b2;
    --accent: #6c8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 16px;
    padding: 32px 24px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  h1 { font-size: 1.25rem; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 24px; font-size: 0.9rem; }
  #turnstile-container { display: flex; justify-content: center; margin-bottom: 8px; }
  #status { color: var(--muted); font-size: 0.85rem; min-height: 1.2em; margin-top: 8px; }
  #status.error { color: #ff6b6b; }
  #links {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 8px;
  }
  #links a {
    display: block;
    padding: 14px 16px;
    background: #1f232d;
    border: 1px solid #2a2f3b;
    border-radius: 10px;
    color: var(--text);
    text-decoration: none;
    font-weight: 500;
    transition: border-color 0.15s ease, transform 0.1s ease;
  }
  #links a:hover { border-color: var(--accent); transform: translateY(-1px); }
  .hidden { display: none; }
  .spinner {
    width: 20px; height: 20px;
    border: 2px solid #2a2f3b;
    border-top-color: var(--accent);
    border-radius: 50%;
    margin: 0 auto;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <h1>Hey, I'm yof1n 👋</h1>
    <p class="sub">Quick human check, then you're in.</p>

    <div id="gate">
      <div id="turnstile-container"
           class="cf-turnstile"
           data-sitekey="0x4AAAAAAFFKz3lnilmDpRRL"
           data-callback="onTurnstileSuccess"
           data-error-callback="onTurnstileError"
           data-theme="dark">
      </div>
      <div id="status"></div>
    </div>

    <div id="links" class="hidden"></div>
  </div>

<script>
  const statusEl = document.getElementById("status");
  const gateEl = document.getElementById("gate");
  const linksEl = document.getElementById("links");

  function setStatus(text, isError) {
    statusEl.textContent = text;
    statusEl.className = isError ? "error" : "";
  }

  // Called by the Turnstile widget once the visitor passes the challenge.
  // The token proves *to the server* that this was a real human — it is
  // never trusted client-side, it's only ever forwarded for verification.
  async function onTurnstileSuccess(token) {
    setStatus("Verifying…");
    try {
      const res = await fetch("/api/verify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token }),
        credentials: "same-origin",
      });
      const data = await res.json();
      if (!data.success) {
        setStatus("Verification failed. Please try again.", true);
        return;
      }
      await loadLinks();
    } catch (err) {
      setStatus("Something went wrong. Please retry.", true);
    }
  }

  function onTurnstileError() {
    setStatus("Challenge failed to load. Refresh and try again.", true);
  }

  // Only fetched AFTER verification succeeds. Until then, the real links
  // do not exist anywhere in this page or in any file a scanner could
  // download — /api/links refuses any request without a valid session.
  async function loadLinks() {
    const res = await fetch("/api/links", { credentials: "same-origin" });
    if (!res.ok) {
      setStatus("Verification expired. Refresh and try again.", true);
      return;
    }
    const data = await res.json();
    gateEl.classList.add("hidden");
    linksEl.innerHTML = "";
    (data.links || []).forEach((link) => {
      const a = document.createElement("a");
      a.href = link.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = link.label;
      linksEl.appendChild(a);
    });
    linksEl.classList.remove("hidden");
  }
</script>
</body>
</html>
